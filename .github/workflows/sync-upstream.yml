name: Sync DiPlay upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: diplay-upstream-sync
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Merge upstream into an isolated branch
        id: merge
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/shihabal3amri/DiPlay.git main:refs/remotes/upstream/main
          upstream_sha="$(git rev-parse refs/remotes/upstream/main)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No new upstream commits.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c sync/diplay-upstream
          if ! git merge --no-ff --no-edit "$upstream_sha"; then
            echo '## Upstream merge needs manual conflict resolution' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.merge.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        if: steps.merge.outputs.changed == 'true'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        if: steps.merge.outputs.changed == 'true'
      - name: Check merged source without release credentials
        if: steps.merge.outputs.changed == 'true'
        run: |
          python3 scripts/check_public_tree.py
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest \
            :mobile:lintDebug :home:lintDebug :maphost:lintDebug \
            :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging mobile/build/outputs/apk/debug/mobile-debug.apk)"
          grep -F "package: name='com.wakamda.dwcoffee.hudtest'" <<< "$badging"
          grep -F "application-label:'DiPlay With Coffee'" <<< "$badging"

  publish:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Publish the verified merge for review
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_UPSTREAM_SHA: ${{ needs.verify.outputs.upstream_sha }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/shihabal3amri/DiPlay.git main:refs/remotes/upstream/main
          test "$(git rev-parse refs/remotes/upstream/main)" = "$VERIFIED_UPSTREAM_SHA"
          git switch -c sync/diplay-upstream
          git merge --no-ff --no-edit "$VERIFIED_UPSTREAM_SHA"
          git push --force-with-lease origin HEAD:refs/heads/sync/diplay-upstream
          if [ -z "$(gh pr list --base develop --head sync/diplay-upstream --state open --json number --jq '.[0].number // empty')" ]; then
            cat > "$RUNNER_TEMP/upstream-sync-pr.md" <<'EOF'
          Merges DiPlay upstream into dwccoffee while preserving the Coffee commits.

          The full Android source checks passed in the upstream sync workflow. Review the diff and test BYD and GWM WEY behavior before merging. This PR does not build or publish a release APK.
          EOF
            gh pr create --base develop --head sync/diplay-upstream \
              --title "Sync DiPlay upstream ${VERIFIED_UPSTREAM_SHA:0:12}" \
              --body-file "$RUNNER_TEMP/upstream-sync-pr.md"
          fi
